---
# ================================================================
# vlans.yml — Reconcile VLANs on leaves against vlans.py SSOT
#
# Usage:
#   Add a VLAN   → add its dict to vlans.py VLANS list, then run this playbook.
#   Remove a VLAN → remove its dict from vlans.py VLANS list, then run this playbook.
#
# The playbook computes the diff between the switch state and the SSOT
# and applies only the necessary adds/removals — no hardcoding required.
# ================================================================
- name: Reconcile VLANs from SSOT (vlans.py)
  hosts: leaves
  gather_facts: no

  tasks:

    # ------------------------------------------------------------------
    # 1. Gather current state from the switch
    # ------------------------------------------------------------------
    - name: Gather current VLAN database from switch
      arista.eos.eos_command:
        commands:
          - command: show vlan
            output: json
      register: show_vlan_result

    # VLANs currently on the switch (excluding VLAN 1 which must never be removed)
    - name: Compute existing VLAN IDs
      set_fact:
        existing_vlan_ids: >-
          {{ show_vlan_result.stdout[0].vlans.keys()
             | map('int') | reject('equalto', 1) | list }}

    # Gather current VXLAN VNI mappings
    - name: Gather current VXLAN VNI mappings
      arista.eos.eos_command:
        commands:
          - command: show interfaces {{ vxlan_interface }}
            output: json
      register: show_vxlan_result
      when: is_vtep

    # ------------------------------------------------------------------
    # 2. Compute the diff
    # ------------------------------------------------------------------
    - name: Compute desired VLAN IDs (from SSOT)
      set_fact:
        desired_vlan_ids: "{{ vlans | map(attribute='vlan_id') | list }}"

    - name: Compute VLANs to remove (on switch but absent from SSOT)
      set_fact:
        vlans_to_remove: "{{ existing_vlan_ids | difference(desired_vlan_ids) | list }}"

    - name: Report planned changes
      debug:
        msg: >-
          SSOT desires: {{ desired_vlan_ids }}.
          On switch: {{ existing_vlan_ids }}.
          To add/update: {{ desired_vlan_ids | difference(existing_vlan_ids) }}.
          To remove: {{ vlans_to_remove }}.

    # ------------------------------------------------------------------
    # 3. Remove stale VLANs (switch has them, SSOT does not)
    #    Order matters: clean up EVPN and VXLAN before the VLAN itself.
    # ------------------------------------------------------------------
    - name: Remove stale EVPN MAC-VRF configs
      arista.eos.eos_config:
        lines:
          - "no vlan {{ item }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ vlans_to_remove }}"
      when: vlans_to_remove | length > 0

    - name: Remove stale VXLAN VNI mappings
      arista.eos.eos_config:
        lines:
          - "no vxlan vlan {{ item }} vni"
        parents: "interface {{ vxlan_interface }}"
      loop: "{{ vlans_to_remove }}"
      when: vlans_to_remove | length > 0

    - name: Remove stale VLANs from VLAN database
      arista.eos.eos_config:
        lines:
          - "no vlan {{ item }}"
      loop: "{{ vlans_to_remove }}"
      when: vlans_to_remove | length > 0

    # ------------------------------------------------------------------
    # 4. Add / update desired VLANs (idempotent — safe to re-run)
    # ------------------------------------------------------------------
    - name: Add/update VLANs in VLAN database
      arista.eos.eos_config:
        lines:
          - "name {{ item.name }}"
        parents: "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    - name: Add/update VXLAN VNI mappings
      arista.eos.eos_config:
        lines:
          - "vxlan vlan {{ item.vlan_id }} vni {{ item.vni }}"
        parents: "interface {{ vxlan_interface }}"
      loop: "{{ vlans }}"

    - name: Add/update EVPN MAC-VRF configs
      arista.eos.eos_config:
        lines:
          - "rd auto"
          - "route-target both {{ item.vni }}:{{ item.vni }}"
          - "redistribute learned"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    # ------------------------------------------------------------------
    # 5. Reconcile server-facing trunk ports
    #    Always set the allowed VLAN list to exactly what the SSOT says.
    # ------------------------------------------------------------------
    - name: Reconcile allowed VLANs on server-facing trunk ports
      arista.eos.eos_config:
        lines:
          - "switchport trunk allowed vlan {{ vlans | map(attribute='vlan_id') | join(',') }}"
        parents: "interface {{ item }}"
      loop: "{{ server_interfaces }}"

    # ------------------------------------------------------------------
    # 6. Save and verify
    # ------------------------------------------------------------------
    - name: Save config
      arista.eos.eos_command:
        commands: write memory

    - name: Verify VLAN database after reconciliation
      arista.eos.eos_command:
        commands: show vlan brief
      register: vlan_verify

    - name: Print VLAN database
      debug:
        msg: "{{ vlan_verify.stdout_lines[0] }}"

    - name: Verify VXLAN VNI table after reconciliation
      arista.eos.eos_command:
        commands: show vxlan vni
      register: vni_verify

    - name: Print VXLAN VNI table
      debug:
        msg: "{{ vni_verify.stdout_lines[0] }}"
