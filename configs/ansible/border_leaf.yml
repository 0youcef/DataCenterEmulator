---
- name: Configure External Handoffs on Border Leaves
  hosts: border_leaves
  gather_facts: no

  tasks:
    - name: Ensure correct hostname
      arista.eos.eos_config:
        lines:
          - "hostname {{ hostname }}"

    # ------------------------------------------------------------------
    # 1. Parent interface — set to routed mode once.
    #    We use a unique list of parent interfaces to avoid applying
    #    "no switchport" multiple times if tenants share the same port.
    # ------------------------------------------------------------------
    - name: Set parent interface to routed mode (no switchport)
      arista.eos.eos_config:
        lines:
          - "no switchport"
          - "no shutdown"
        parents: "interface {{ item }}"
      loop: "{{ external_handoffs | map(attribute='interface') | unique | list }}"

    # ------------------------------------------------------------------
    # 2a. Create subinterface and set 802.1Q encapsulation.
    #     Subinterface name = parent + "." + vlan  (e.g. Ethernet10.10)
    #     Encapsulation MUST be set before VRF — EOS rejects VRF assignment
    #     on a subinterface that has no encapsulation defined yet.
    # ------------------------------------------------------------------
    - name: Set 802.1Q encapsulation on subinterface
      arista.eos.eos_config:
        lines:
          - "encapsulation dot1q vlan {{ item.vlan }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2b. Assign VRF — wipes any IP on the subinterface (EOS behavior)
    # ------------------------------------------------------------------
    - name: Assign subinterface to VRF
      arista.eos.eos_config:
        lines:
          - "vrf {{ item.vrf }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2c. Assign IP in a separate task — must run after VRF assignment
    #     because VRF assignment clears the IP.
    # ------------------------------------------------------------------
    - name: Assign IP address to subinterface
      arista.eos.eos_config:
        lines:
          - "ip address {{ item.local_ip }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 3. eBGP neighbor — declared inside the VRF BGP context
    # ------------------------------------------------------------------
    - name: Configure eBGP neighbor toward external router
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} remote-as {{ item.peer_asn }}"
          - "neighbor {{ item.peer_ip }} description EXTERNAL_ROUTER"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    - name: Activate eBGP neighbor in IPv4 address-family
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} activate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
          - "address-family ipv4"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 4. Tie external BGP to EVPN fabric via route-targets
    # ------------------------------------------------------------------
    - name: Redistribute routes between EVPN and external BGP
      arista.eos.eos_config:
        lines:
          - "route-target import evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "route-target export evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "redistribute connected"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory
