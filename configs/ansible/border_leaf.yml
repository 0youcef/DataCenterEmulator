---
- name: Configure External Handoffs on Border Leaves
  hosts: border_leaves
  gather_facts: no

  tasks:
    - name: Ensure correct hostname
      arista.eos.eos_config:
        lines:
          - "hostname {{ hostname }}"

    # ------------------------------------------------------------------
    # 1a. Set interface to routed mode first
    # ------------------------------------------------------------------
    - name: Set External Interface to routed mode
      arista.eos.eos_config:
        lines:
          - "no switchport"
          - "no shutdown"
        parents: "interface {{ item.interface }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 1b. Assign VRF — this wipes any IP already on the interface
    # ------------------------------------------------------------------
    - name: Assign External Interface to VRF
      arista.eos.eos_config:
        lines:
          - "vrf {{ item.vrf }}"
        parents: "interface {{ item.interface }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 1c. Assign IP in a separate task — guarantees it runs AFTER the VRF
    #     assignment. Bundling with the vrf line risks silent omission
    #     because eos_config idempotency check sees the interface already
    #     has vrf and skips re-applying lines it thinks are unchanged,
    #     including the ip address that was just wiped.
    # ------------------------------------------------------------------
    - name: Assign IP Address to External Interface
      arista.eos.eos_config:
        lines:
          - "ip address {{ item.local_ip }}"
        parents: "interface {{ item.interface }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2. eBGP neighbor — declared inside VRF BGP context
    # ------------------------------------------------------------------
    - name: Configure eBGP neighbor toward external router
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} remote-as {{ item.peer_asn }}"
          - "neighbor {{ item.peer_ip }} description EXTERNAL_ROUTER"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2b. Activate inside address-family ipv4 — not directly under vrf
    # ------------------------------------------------------------------
    - name: Activate eBGP neighbor in IPv4 address-family
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} activate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
          - "address-family ipv4"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 3. Tie external BGP to EVPN fabric via route-targets
    # ------------------------------------------------------------------
    - name: Redistribute routes between EVPN and external BGP
      arista.eos.eos_config:
        lines:
          - "route-target import evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "route-target export evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "redistribute connected"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory
