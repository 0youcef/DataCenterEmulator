---
- name: Configure External Handoffs on Border Leaves
  hosts: border_leaves
  gather_facts: no

  tasks:
    - name: Ensure correct hostname
      arista.eos.eos_config:
        lines:
          - "hostname {{ hostname }}"

    # ------------------------------------------------------------------
    # 1. Parent interface — set to routed mode once.
    # ------------------------------------------------------------------
    - name: Set parent interface to routed mode (no switchport)
      arista.eos.eos_config:
        lines:
          - "no channel-group"
          - "no switchport"
          - "no shutdown"
        parents: "interface {{ item }}"
      loop: "{{ external_handoffs | map(attribute='interface') | unique | list }}"

    # ------------------------------------------------------------------
    # 2a. Encapsulation MUST be set before VRF assignment
    # ------------------------------------------------------------------
    - name: Set 802.1Q encapsulation on subinterface
      arista.eos.eos_config:
        lines:
          - "encapsulation dot1q vlan {{ item.vlan }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2b. VRF assignment — wipes any IP (EOS behavior)
    # ------------------------------------------------------------------
    - name: Assign subinterface to VRF
      arista.eos.eos_config:
        lines:
          - "vrf {{ item.vrf }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 2c. IP after VRF — separate task guarantees order
    # ------------------------------------------------------------------
    - name: Assign IP address to subinterface
      arista.eos.eos_config:
        lines:
          - "ip address {{ item.local_ip }}"
        parents: "interface {{ item.interface }}.{{ item.vlan }}"
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 3. eBGP neighbor toward FRR
    # ------------------------------------------------------------------
    - name: Configure eBGP neighbor toward external router
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} remote-as {{ item.peer_asn }}"
          - "neighbor {{ item.peer_ip }} description EXTERNAL_ROUTER"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    - name: Activate eBGP neighbor in IPv4 address-family
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} activate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
          - "address-family ipv4"
      loop: "{{ external_handoffs }}"

    - name: Originate default route toward external peer for selected VRFs
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} default-originate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      when: item.originate_default_route | default(false)
      loop: "{{ external_handoffs }}"

    # ------------------------------------------------------------------
    # 4. Route redistribution — tie external BGP to EVPN fabric
    #
    # CRITICAL FIX: added "redistribute bgp".
    # "redistribute connected" only pushes directly attached subnets
    # (the /30 handoff link) into EVPN. It does NOT push BGP-learned
    # routes received from FRR (e.g. 8.8.8.8/32). Without this line,
    # Border-1 installs FRR routes in its local VRF table but never
    # re-advertises them as EVPN type-5 — so no other leaf ever sees
    # them and pings from tenant servers go nowhere.
    # ------------------------------------------------------------------
    - name: Redistribute routes between EVPN and external BGP
      arista.eos.eos_config:
        lines:
          - "route-target import evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "route-target export evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "redistribute connected"
          - "redistribute bgp leaked"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.vrf }}"
      loop: "{{ external_handoffs }}"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory
