---
- name: Configure Enterprise Underlay (BFD + Peer Groups + Route Filtering)
  hosts: switches
  gather_facts: no

  tasks:

    # =======================================================
    # 1. SECURITY: Route Filtering (Prefix-Lists & Route-Maps)
    # =======================================================
    - name: Add underlay Loopback0 to Prefix-List
      arista.eos.eos_config:
        lines:
          - "seq 10 permit {{ loopback_ip }}/32"
        parents: "ip prefix-list PL-LOOPBACKS"

    # CRITICAL FIX: VTEP Loopback1 IPs (10.254.0.x/32) are advertised into
    # BGP in overlay.yml via "network {{ vtep_ip }}/32". However, the outbound
    # route-map RM-UNDERLAY-OUT filters BGP advertisements to only what matches
    # PL-LOOPBACKS. Without this entry, VTEP /32 routes are silently dropped
    # before reaching spine peers — VXLAN tunnels can never establish because
    # no leaf knows how to reach any other leaf's VTEP IP.
    - name: Add VTEP Loopback1 to Prefix-List (Leaves/VTEPs only)
      arista.eos.eos_config:
        lines:
          - "seq 20 permit {{ vtep_ip }}/32"
        parents: "ip prefix-list PL-LOOPBACKS"
      when: is_vtep

    - name: Create Route-Map to apply the Prefix-List outbound
      arista.eos.eos_config:
        lines:
          - "match ip address prefix-list PL-LOOPBACKS"
        parents: "route-map RM-UNDERLAY-OUT permit 10"

    # =======================================================
    # 2. INTERFACES: Loopback & P2P with BFD
    # =======================================================
    - name: Configure underlay Loopback
      arista.eos.eos_config:
        lines:
          - "ip address {{ loopback_ip }}/32"
        parents: "interface {{ loopback_interface }}"

    # no ip address runs first so any stale IP from a previous topology
    # deployment (e.g. after add_node.py shifts the /31 address plan) is
    # cleared before the new address is assigned.  EOS rejects an "ip address"
    # command when the same IP is already present on a *different* interface,
    # and "no ip address" is a safe no-op when the interface is already clean.
    - name: Configure fabric P2P interfaces with BFD
      arista.eos.eos_config:
        lines:
          - "description P2P to {{ item.peer_name }}"
          - "no switchport"
          - "no ip address"
          - "ip address {{ item.ip }}/31"
          - "bfd interval 300 min-rx 300 multiplier 3"
          - "no shutdown"
        parents: "interface {{ item.interface }}"
      loop: "{{ fabric_interfaces }}"

    # =======================================================
    # 3. ROUTING & ECMP
    # =======================================================
    - name: Enable global IP routing
      arista.eos.eos_config:
        lines:
          - "ip routing"

    - name: Enable maximum ECMP paths
      arista.eos.eos_config:
        lines:
          - "maximum-paths {{ groups['spines'] | length if inventory_hostname in
            groups['leaves'] else groups['leaves'] | length }}"
        parents: "router bgp {{ bgp_asn }}"

    # =======================================================
    # 4. BGP: Peer Groups & Neighbors
    # =======================================================
    - name: Configure eBGP router-id and Create Peer Group
      arista.eos.eos_config:
        lines:
          - "router-id {{ loopback_ip }}"
          - "neighbor IPv4-UNDERLAY peer group"
          - "neighbor IPv4-UNDERLAY send-community"
          - "neighbor IPv4-UNDERLAY bfd"
        parents: "router bgp {{ bgp_asn }}"

    - name: Allow AS-Path for Spines (since spines share AS 65000)
      arista.eos.eos_config:
        lines:
          - "neighbor IPv4-UNDERLAY allowas-in 1"
        parents: "router bgp {{ bgp_asn }}"
      when: inventory_hostname in groups['spines']

    - name: Map physical neighbors to the Peer Group
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.peer_ip }} peer group IPv4-UNDERLAY"
          - "neighbor {{ item.peer_ip }} remote-as {{ item.peer_asn }}"
          - "neighbor {{ item.peer_ip }} description {{ item.peer_name }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ fabric_interfaces }}"

    # =======================================================
    # 5. BGP: Address Family & Advertising Routes
    # =======================================================
    - name: Activate Peer Group and Apply outbound Route-Map
      arista.eos.eos_config:
        lines:
          - "neighbor IPv4-UNDERLAY activate"
          - "{{ 'neighbor IPv4-UNDERLAY route-map RM-UNDERLAY-OUT out' if
            inventory_hostname in groups['leaves'] else 'no neighbor
            IPv4-UNDERLAY route-map RM-UNDERLAY-OUT out' }}"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "address-family ipv4"

    - name: Advertise underlay Loopback into BGP
      arista.eos.eos_config:
        lines:
          - "network {{ loopback_ip }}/32"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "address-family ipv4"

    # =======================================================
    # 6. SAVE & VERIFY
    # =======================================================
    - name: Save config
      arista.eos.eos_command:
        commands: write memory

    - name: Show BGP summary
      arista.eos.eos_command:
        commands: show bgp summary
      register: bgp_summary

    - name: Print BGP summary
      debug:
        msg: "{{ bgp_summary.stdout_lines[0] }}"
