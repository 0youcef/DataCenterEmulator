---
# ================================================================
# SPINES — Route EVPN traffic via Loopbacks (eBGP Next-Hop Unchanged)
# ================================================================
- name: Configure EVPN on Spines
  hosts: spines
  gather_facts: no

  tasks:
    - name: Create EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY peer group"
          - "neighbor EVPN-OVERLAY update-source {{ loopback_interface }}"
          - "neighbor EVPN-OVERLAY ebgp-multihop 3"
          - "neighbor EVPN-OVERLAY send-community extended"
        parents: "router bgp {{ bgp_asn }}"

    - name: Add Leaves to EVPN peer group (via Loopback)
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.ip }} peer group EVPN-OVERLAY"
          - "neighbor {{ item.ip }} remote-as {{ item.asn }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ overlay_peers }}"

    - name: Activate EVPN address-family and preserve Next-Hop
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY activate"
          # Critical for eBGP EVPN: do not rewrite next-hop to spine IP.
          # Leaves must see each other's VTEP IPs as the BGP next-hop.
          - "neighbor EVPN-OVERLAY next-hop-unchanged"
        parents:
          - "router bgp {{ bgp_asn }}"
          - address-family evpn

    - name: Save config
      arista.eos.eos_command:
        commands: write memory


# ================================================================
# LEAVES — VTEPs: VLANs, VXLAN interface, EVPN Loopback Peers
# ================================================================
- name: Configure EVPN on Leaves (VTEPs)
  hosts: leaves
  gather_facts: no

  tasks:
    # ------------------------------------------------------------------
    # VLANs (initial provisioning from SSOT)
    # Use vlans.yml for day-2 add/remove reconciliation.
    # ------------------------------------------------------------------
    - name: Create VLANs
      arista.eos.eos_config:
        lines:
          - "name {{ item.name }}"
        parents: "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    # ------------------------------------------------------------------
    # VTEP Loopback — must be a separate interface from the underlay loopback
    # ------------------------------------------------------------------
    - name: Configure VTEP Loopback IP
      arista.eos.eos_config:
        lines:
          - "ip address {{ vtep_ip }}/32"
        parents: "interface {{ vtep_interface }}"

    - name: Advertise VTEP Loopback into IPv4 underlay so all VTEPs are reachable
      arista.eos.eos_config:
        lines:
          - "network {{ vtep_ip }}/32"
        parents:
          - "router bgp {{ bgp_asn }}"
          - address-family ipv4

    # ------------------------------------------------------------------
    # VXLAN interface
    # ------------------------------------------------------------------
    - name: Configure VXLAN interface
      arista.eos.eos_config:
        lines:
          - "vxlan source-interface {{ vtep_interface }}"
          - "vxlan udp-port 4789"
        parents: "interface {{ vxlan_interface }}"

    - name: Map VLANs to VNIs
      arista.eos.eos_config:
        lines:
          - "vxlan vlan {{ item.vlan_id }} vni {{ item.vni }}"
        parents: "interface {{ vxlan_interface }}"
      loop: "{{ vlans }}"

    # ------------------------------------------------------------------
    # EVPN overlay BGP
    # ------------------------------------------------------------------
    - name: Create EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY peer group"
          - "neighbor EVPN-OVERLAY update-source {{ loopback_interface }}"
          - "neighbor EVPN-OVERLAY ebgp-multihop 3"
          - "neighbor EVPN-OVERLAY send-community extended"
        parents: "router bgp {{ bgp_asn }}"

    - name: Add Spines to EVPN peer group (via Loopback)
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.ip }} peer group EVPN-OVERLAY"
          - "neighbor {{ item.ip }} remote-as {{ item.asn }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ overlay_peers }}"

    - name: Activate EVPN address-family
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY activate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - address-family evpn

    - name: Advertise VLANs into EVPN (MAC-VRF per VLAN)
      arista.eos.eos_config:
        lines:
          - "rd auto"
          - "route-target both {{ item.vni }}:{{ item.vni }}"
          - "redistribute learned"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    # ------------------------------------------------------------------
    # Server-facing trunk ports
    # ------------------------------------------------------------------
    - name: Configure server-facing ports as trunk
      arista.eos.eos_config:
        lines:
          - switchport mode trunk
          - "switchport trunk allowed vlan {{ vlans | map(attribute='vlan_id') | join(',') }}"
          - no shutdown
        parents: "interface {{ item }}"
      loop: "{{ server_interfaces }}"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory


# ================================================================
# Verify
# ================================================================
- name: Verify overlay
  hosts: switches
  gather_facts: no

  tasks:
    - name: Show EVPN summary
      arista.eos.eos_command:
        commands: show bgp evpn summary
      register: evpn_summary

    - name: Print EVPN summary
      debug:
        msg: "{{ evpn_summary.stdout_lines[0] }}"

    - name: Show VXLAN interface
      arista.eos.eos_command:
        commands: "show interfaces {{ vxlan_interface }}"
      register: vxlan_iface
      when: is_vtep

    - name: Print VXLAN interface
      debug:
        msg: "{{ vxlan_iface.stdout_lines[0] }}"
      when: is_vtep
