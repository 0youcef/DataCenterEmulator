---
# ================================================================
# SPINES — Route Reflectors / Transit (eBGP Next-Hop Unchanged)
# ================================================================
- name: Configure EVPN on Spines
  hosts: spines
  gather_facts: no

  tasks:
    - name: Create EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY peer group"
          - "neighbor EVPN-OVERLAY update-source {{ loopback_interface }}"
          - "neighbor EVPN-OVERLAY ebgp-multihop 3"
          - "neighbor EVPN-OVERLAY send-community extended"
        parents: "router bgp {{ bgp_asn }}"

    - name: Add Leaves to EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.ip }} peer group EVPN-OVERLAY"
          - "neighbor {{ item.ip }} remote-as {{ item.asn }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ overlay_peers }}"

    - name: Activate EVPN address-family & preserve Next-Hop
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY activate"
          - "neighbor EVPN-OVERLAY next-hop-unchanged"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "address-family evpn"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory


# ================================================================
# LEAVES — VTEPs (Symmetric IRB, VRFs, Anycast Gateways)
# ================================================================
- name: Configure EVPN Layer 3 on Leaves
  hosts: leaves
  gather_facts: no

  tasks:
    # ------------------------------------------------------------------
    # 1. Global Routing & Anycast MAC
    # ------------------------------------------------------------------
    - name: Set Global Anycast Gateway MAC Address
      arista.eos.eos_config:
        lines:
          - "ip virtual-router mac-address 00:1c:73:00:00:99"

    # Skip VRF creation for L2-only tenants (l3: false)
    - name: Create Tenant VRF instances
      arista.eos.eos_config:
        lines:
          - "vrf instance {{ item.name }}"
      when: item.l3 | default(true)
      loop: "{{ tenants }}"

    - name: Enable IP routing in Tenant VRFs
      arista.eos.eos_config:
        lines:
          - "ip routing vrf {{ item.name }}"
      when: item.l3 | default(true)
      loop: "{{ tenants }}"

    # ------------------------------------------------------------------
    # 2. Local Networks (VLANs & Anycast Gateways)
    # ------------------------------------------------------------------
    - name: Create Layer 2 VLANs
      arista.eos.eos_config:
        lines:
          - "name {{ item.name }}"
        parents: "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    # EOS clears IP when VRF is assigned — must be two separate tasks.
    # Skip for L2-only VLANs that have no vrf field.
    - name: Assign SVI to Tenant VRF
      arista.eos.eos_config:
        lines:
          - "vrf {{ item.vrf }}"
        parents: "interface Vlan{{ item.vlan_id }}"
      when: item.vrf is defined
      loop: "{{ vlans }}"

    - name: Set Anycast Gateway IP on SVI
      arista.eos.eos_config:
        lines:
          - "ip address virtual {{ item.anycast_ip }}"
        parents: "interface Vlan{{ item.vlan_id }}"
      when: item.anycast_ip is defined
      loop: "{{ vlans }}"

    # ------------------------------------------------------------------
    # 3. VTEP Loopback
    # ------------------------------------------------------------------
    - name: Configure VTEP Loopback IP
      arista.eos.eos_config:
        lines:
          - "ip address {{ vtep_ip }}/32"
        parents: "interface {{ vtep_interface }}"

    - name: Advertise VTEP Loopback into IPv4 underlay
      arista.eos.eos_config:
        lines:
          - "network {{ vtep_ip }}/32"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "address-family ipv4"

    # ------------------------------------------------------------------
    # 4. Data Plane: VXLAN Interface (L2 & L3 VNIs)
    # ------------------------------------------------------------------
    - name: Configure Base VXLAN Interface
      arista.eos.eos_config:
        lines:
          - "vxlan source-interface {{ vtep_interface }}"
          - "vxlan udp-port 4789"
        parents: "interface {{ vxlan_interface }}"

    - name: Map Layer 2 VNIs (Bridging)
      arista.eos.eos_config:
        lines:
          - "vxlan vlan {{ item.vlan_id }} vni {{ item.vni }}"
        parents: "interface {{ vxlan_interface }}"
      loop: "{{ vlans }}"

    # Skip L3 VNI mapping for L2-only tenants
    - name: Map Layer 3 VNIs (Routing Transit)
      arista.eos.eos_config:
        lines:
          - "vxlan vrf {{ item.name }} vni {{ item.l3_vni }}"
        parents: "interface {{ vxlan_interface }}"
      when: item.l3 | default(true)
      loop: "{{ tenants }}"

    # ------------------------------------------------------------------
    # 5. Control Plane: BGP EVPN Overlay
    # ------------------------------------------------------------------
    - name: Create EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY peer group"
          - "neighbor EVPN-OVERLAY update-source {{ loopback_interface }}"
          - "neighbor EVPN-OVERLAY ebgp-multihop 3"
          - "neighbor EVPN-OVERLAY send-community extended"
        parents: "router bgp {{ bgp_asn }}"

    - name: Add Spines to EVPN peer group
      arista.eos.eos_config:
        lines:
          - "neighbor {{ item.ip }} peer group EVPN-OVERLAY"
          - "neighbor {{ item.ip }} remote-as {{ item.asn }}"
        parents: "router bgp {{ bgp_asn }}"
      loop: "{{ overlay_peers }}"

    - name: Activate EVPN address-family
      arista.eos.eos_config:
        lines:
          - "neighbor EVPN-OVERLAY activate"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "address-family evpn"

    # ------------------------------------------------------------------
    # 6. BGP Advertisement: MAC-VRFs (L2) and IP-VRFs (L3)
    # ------------------------------------------------------------------
    - name: Advertise VLANs into EVPN (MAC-VRF)
      arista.eos.eos_config:
        lines:
          - "rd auto"
          - "route-target both {{ item.vni }}:{{ item.vni }}"
          - "redistribute learned"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vlan {{ item.vlan_id }}"
      loop: "{{ vlans }}"

    # Skip IP-VRF advertisement for L2-only tenants
    # rd uses loopback_ip:l3_vni — ensures uniqueness per leaf (standard practice)
    - name: Advertise Tenant Routing Tables into EVPN (IP-VRF)
      arista.eos.eos_config:
        lines:
          - "rd {{ loopback_ip }}:{{ item.l3_vni }}"
          - "route-target import evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "route-target export evpn {{ item.l3_vni }}:{{ item.l3_vni }}"
          - "redistribute connected"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.name }}"
      when: item.l3 | default(true)
      loop: "{{ tenants }}"

    # ------------------------------------------------------------------
    # 7. Inter-VRF Route Leaking
    #
    # Each tenant in vlans.py can declare import_rts: [l3_vni, ...]
    # to pull routes from another VRF into its own routing table.
    # This task uses subelements to flatten the nested list:
    #   item.0 = the tenant dict
    #   item.1 = one l3_vni to import from a foreign VRF
    #
    # Example: VRF_PEDAGOGY with import_rts: [50020] adds:
    #   route-target import evpn 50020:50020
    # under its own VRF BGP context, so it installs VRF_RESEARCH prefixes.
    # Both VRFs must declare the other's l3_vni for symmetric routing.
    # ------------------------------------------------------------------
    - name: Apply inter-VRF route-target imports
      arista.eos.eos_config:
        lines:
          - "route-target import evpn {{ item.1 }}:{{ item.1 }}"
        parents:
          - "router bgp {{ bgp_asn }}"
          - "vrf {{ item.0.name }}"
      loop: "{{ tenants | subelements('import_rts', skip_missing=True) }}"

    # ------------------------------------------------------------------
    # 8. Server-Facing Ports & Save
    # ------------------------------------------------------------------
    - name: Configure server-facing ports as trunk
      arista.eos.eos_config:
        lines:
          - "switchport mode trunk"
          - "switchport trunk allowed vlan {{ vlans | map(attribute='vlan_id') | join(',') }}"
          - "no shutdown"
        parents: "interface {{ item }}"
      loop: "{{ server_interfaces }}"

    - name: Save config
      arista.eos.eos_command:
        commands: write memory
