---
- name: Configure Arista Switches via eAPI
  hosts: switches
  gather_facts: false
  become: true
  tasks:

    - name: Verify connectivity
      arista.eos.eos_command:
        commands: show version
      register: version_output

    - name: Print EOS version
      debug:
        msg: >-
          {{ inventory_hostname }} is running EOS
          {{ version_output.stdout[0].splitlines() 
             | select('match', '.*Software image version.*') 
             | first 
             | split(': ') 
             | last }}

    - name: Set hostname
      arista.eos.eos_config:
        lines:
          - "hostname {{ inventory_hostname }}"

    - name: Configure management interface
      arista.eos.eos_config:
        lines:
          - "ip address {{ ansible_host }}/24"
          - no shutdown
        parents: interface Management1

    - name: Enable IP routing
      arista.eos.eos_config:
        lines:
          - ip routing

    - name: Save config
      arista.eos.eos_command:
        commands: write memory
